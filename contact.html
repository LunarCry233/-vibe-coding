<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我 · 张三</title>
  <meta name="description" content="联系张三：邮箱、留言表单与社交链接，欢迎合作与交流。">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <!-- TODO: 将邮箱、GitHub、微信替换为真实联系方式 -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">张三<span class="brand-dot">.</span></a>
      <button class="nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="siteNav">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav" aria-label="主导航">
        <ul>
          <li><a href="index.html" class="nav-link">主页</a></li>
          <li><a href="about.html" class="nav-link">关于我</a></li>
          <li><a href="portfolio.html" class="nav-link">作品集</a></li>
          <li><a href="contact.html" class="nav-link active" aria-current="page">联系我</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container reveal">
        <p class="section-kicker">联系我</p>
        <h1 class="section-title">期待和你聊聊</h1>
        <p class="section-sub">无论是合作、招聘还是单纯交流，都欢迎给我留言，一般 24–48 小时内回复。</p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-layout">
        <div class="contact-info reveal">
          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
            <div>
              <h3>邮箱</h3>
              <p><a href="mailto:hello@example.com">hello@example.com</a></p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            </div>
            <div>
              <h3>GitHub</h3>
              <p><a href="https://github.com/yourname" target="_blank" rel="noopener">github.com/yourname</a></p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <div>
              <h3>微信</h3>
              <p>your-wechat-id（占位，可替换为二维码图片）</p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div>
              <h3>所在地</h3>
              <p>上海（支持远程）</p>
            </div>
          </div>
          <p>回复说明：工作日一般 24 小时内回复，周末可能稍慢。</p>
        </div>

        <div class="form-card reveal">
          <h2 class="section-title" style="font-size: 1.4rem;">发送留言</h2>
          <!-- TODO: 部署到 Vercel 前，先注册 Formspree（免费），把下面 action 里的 YOUR_FORM_ID 换成真实 ID，例如 https://formspree.io/f/abcdwxyz -->
<form name="contact" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">
            <p class="visually-hidden">
              <label>不要填写这个字段：<input name="_gotcha"></label>
            </p>
            <div class="form-group">
              <label for="name">姓名</label>
              <input type="text" id="name" name="name" placeholder="你的名字" required autocomplete="name">
            </div>
            <div class="form-group">
              <label for="email">邮箱</label>
              <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
              <label for="message">留言</label>
              <textarea id="message" name="message" placeholder="想说的话…" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">发送留言</button>
            <p class="form-note">表单由 Formspree 处理，配置表单 ID 后提交内容会直接发送到你的邮箱。</p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year">2026</span> 张三 · 保留所有权利</p>
      <div class="footer-links">
        <a href="https://github.com/yourname" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:hello@example.com">邮箱</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
